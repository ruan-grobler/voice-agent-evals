name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: the eval replays recorded cassettes, so CI is free and deterministic.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy

      - name: Tests with coverage
        run: pytest --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Cassettes match their dialogue scripts
        run: vae craft --check

      - name: Regression gate (v2 against the saved baseline)
        run: vae run --agent v2 --baseline baselines/v2.json --out reports/ci

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/ci/
          if-no-files-found: ignore
