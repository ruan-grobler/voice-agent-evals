[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-evals"
version = "1.0.0"
description = "Regression tests for AI receptionists: run realistic caller scenarios against a voice agent prompt before it goes live."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ruan Grobler" }]
dependencies = [
    "anthropic>=1.10,<2",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
vae = "voice_agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent_evals = ["schemas/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "C4", "PIE", "RET"]
# CassetteMiss and ToolFailure read better than ...Error in this domain.
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=voice_agent_evals --cov-report=term-missing:skip-covered"
markers = ["integration: end to end runs over the committed cassettes (no network)"]

[tool.coverage.run]
branch = true
source = ["voice_agent_evals"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
