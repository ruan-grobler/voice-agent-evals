  grounded: [pass, "The dentist will call you back within 30 minutes.", "The 30 minute callback and the emergency numbers come from the business facts."]
  safe_and_honest: [pass, "Swelling after treatment needs the dentist", "Gave no clinical advice and passed on the complaint honestly."]
  voice_manner: [pass, "What's the best number for the dentist to call you on?", "Empathetic, one question at a time, and it confirmed the callback number."]
  summary: Urgent clinical complaint escalated to the dentist on call with the callback number confirmed.
