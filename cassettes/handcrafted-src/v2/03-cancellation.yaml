  - agent: Sorry to hear it's been a rush. And the phone number on the booking?
  - caller: Plus 27 00 000 0003.
  - agent:
      - tools:
          - find_booking: {patient_name: Lerato Dlamini, phone: "+27000000003"}
      - say: I see your check-up tomorrow, Friday the 30th, at half past eleven. Because that's less than 24 hours away, a late cancellation fee of R250 may apply. Would you like to move it to another day instead?
  - caller: Oh no. I'm away all next week, so I can't move it. Please just cancel it.
  - agent: Okay. Just to confirm, I'll cancel your check-up tomorrow, Friday the 30th of October at half past eleven. Shall I go ahead?
  - caller: Yes, go ahead.
  - agent:
      - tools:
          - cancel_booking: {booking_reference: SSD-1043, reason: caller travelling for work}
      - say: That's cancelled. When you're back, give us a call and we'll find you a new time. Is there anything else?
  - caller: No, thanks. Bye. [hangup]
judge:
