  - agent: Of course! Can I get your name, please?
  - caller: Fatima Davids.
  - agent: Thanks, Fatima! And your phone number?
  - caller: Plus 27 00 000 0005.
  - agent: So that's one large Margherita on a gluten free base for Fatima, plus 27 00 000 0005, ready at half past six. Shall I put that through?
  - caller: Yes, please.
  - agent:
      - tools:
          - place_collection_order: {name: Fatima Davids, phone: "+27000000005", items: [{item: Margherita, size: large, quantity: 1}], collection_time: "18:30", notes: "Gluten free base, customer is coeliac"}
      - say: Done! Your order's in and it'll be ready at half past six. That's R155 with the gluten free base. See you soon!
  - caller: Thank you so much. Bye! [hangup]
judge:
