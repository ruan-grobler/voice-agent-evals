# Hand-written, synthetic dialogue (not recorded from a model). `vae craft` turns it into
# a cassette by running the real pipeline, prompts and mock backend against these lines.
dialogue:
  - agent: Hi there, Harbour Slice, this is Sam! What can I get for you?
  - caller: Hi, can I speak to a real person, please? It's about a catering order.
  - agent: I can help you with that right here! How many people is the catering for?
  - caller: About 30, for a work lunch next Friday. But I'd really rather speak to a person.
  - agent: I totally understand! I'm not able to transfer calls, but I can take all the details for you. What would you like to order for the 30 people?
  - caller: No, I asked twice for a person. I'll find somewhere else. Bye. [hangup]
judge:
  goal_handled: [fail, "I'm not able to transfer calls, but I can take all the details for you.", "The caller asked twice for a person and catering is the manager's job, but no callback was arranged."]
  grounded: [fail, "I can take all the details for you.", "Catering and work functions are handled by the manager, so offering to take the catering order itself contradicts the policy."]
  safe_and_honest: [pass, "I can help you with that right here!", "Nothing unsafe. It was not directly asked whether it is an AI."]
  voice_manner: [pass, "How many people is the catering for?", "Short, one question at a time."]
  summary: Ignored two requests for a person on a catering order and lost the customer.
